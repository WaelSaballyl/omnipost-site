<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>عم يفتح OmniPost…</title>
<link rel="icon" href="../assets/icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap">
<style>
  :root { --bg: #09090B; --ink: #EDEDF0; --ink-2: #A6A6AE; --accent: #4DA3FF; --accent-rgb: 77, 163, 255; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: radial-gradient(700px 360px at 50% 0%, rgba(var(--accent-rgb), .12), transparent 70%), var(--bg);
         color: var(--ink); font: 400 16px/1.7 "IBM Plex Sans Arabic", system-ui, sans-serif; }
  .door { text-align: center; max-width: 460px; }
  .mark { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--accent); color: #04111F; font-weight: 700; font-size: 22px; box-shadow: 0 0 30px -6px rgba(var(--accent-rgb), .6); }
  h1 { margin: 18px 0 6px; font-size: 24px; font-weight: 600; }
  p { margin: 0; color: var(--ink-2); }
  .note { margin-top: 22px; font-size: 14px; }
  .note a { color: var(--accent); word-break: break-all; }
  .err { color: #FF7A70; }
</style>
</head>
<body>
<div class="door">
  <span class="mark" aria-hidden="true">»</span>
  <h1 id="headline">عم يفتح OmniPost…</h1>
  <p id="detail">لحظة، عم نجيب عنوانه.</p>
  <p class="note" id="note" hidden>
    <span id="lead">إذا ما انتقلت لحالك،</span>
    <a id="manual" href="#" dir="ltr">افتحه من هون</a>
  </p>
</div>

<script>
// The fixed front door: reads where.json (written by share.py) and forwards
// the visitor to wherever OmniPost is running.
//
// There used to be a reachability probe here. It was dropped: the address is a
// fixed Tailscale name now, and on any device inside the tailnet that name
// resolves to a private address, so the browser blocks a public page from
// probing it and the probe reported a running site as down.
(function () {
  var headline = document.getElementById("headline");
  var detail = document.getElementById("detail");
  var note = document.getElementById("note");
  var manual = document.getElementById("manual");
  var params = new URLSearchParams(window.location.search);

  // `?to=/settings` opens a specific page. Only a plain single-slash path is
  // accepted, so this cannot bounce anyone to another site.
  var to = params.get("to") || "/";
  if (to.charAt(0) !== "/" || to.charAt(1) === "/" || to.charAt(1) === "\\") to = "/";
  // `?stay=1` shows the address without jumping, for copying it.
  var stay = params.get("stay") === "1";

  function fail(title, message) {
    headline.textContent = title;
    headline.className = "err";
    detail.textContent = message;
  }

  var request = new XMLHttpRequest();
  request.open("GET", "../oauth/where.json?t=" + Date.now(), true);
  request.timeout = 6000;
  request.onload = function () {
    var where = {};
    try { where = JSON.parse(request.responseText) || {}; } catch (e) { /* handled below */ }
    var base = (where.app_url || "").replace(/\/+$/, "");
    if (!/^https:\/\//.test(base)) {
      fail("OmniPost مو منشور هلأ", "ما في عنوان محفوظ لسا. لازم صاحب الموقع يشغّله.");
      return;
    }
    var target = base + to;
    manual.textContent = target;
    manual.href = target;
    note.hidden = false;
    if (stay) {
      headline.textContent = "عنوان OmniPost";
      detail.textContent = "انسخه أو افتحه من هون.";
      document.getElementById("lead").textContent = "العنوان:";
      return;
    }
    detail.textContent = "عم ننقلك على الموقع.";
    window.setTimeout(function () { window.location.replace(target); }, 500);
  };
  request.onerror = request.ontimeout = function () {
    fail("ما قدرنا نجيب العنوان", "تأكد من النت وحدّث الصفحة.");
  };
  request.send();
})();
</script>
</body>
</html>
