<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connecting… — OmniPost</title>
<link rel="stylesheet" href="../style.css">
<style>
  body { display: grid; place-items: center; min-height: 100vh; }
  .wrap { padding: 24px; text-align: center; }
  .big { font-size: 40px; margin-bottom: 10px; }
  .fallback { margin-top: 26px; font-size: 14px; color: var(--muted); }
  .err { color: #f87171; }
</style>
</head>
<body>
<div class="wrap">
  <div class="big">◎</div>
  <h1 id="headline">Finishing the connection…</h1>
  <p id="detail">Handing the authorisation back to OmniPost on your computer.</p>
  <p class="fallback" id="fallback" hidden>
    If nothing happens, make sure OmniPost is running and
    <a id="manual" href="#">click here to continue</a>.
  </p>
</div>

<script>
// Some platforms refuse a plain http://127.0.0.1 redirect URI and insist on a
// public HTTPS address. This page is that public address: it does nothing but
// hand the authorisation code straight back to OmniPost running locally.
//
// Nothing is stored here and nothing is sent anywhere else. There is no
// analytics, no third-party script, and no server behind this page - it is a
// static file, so the code in the URL never reaches anyone but your own machine.
(function () {
  var params = new URLSearchParams(window.location.search);
  // Threads hands the state back wrapped in quotes, so strip any the platform
  // added before reading the platform prefix out of it.
  var state = (params.get("state") || "").replace(/^["'\s]+|["'\s]+$/g, "");
  var error = params.get("error");

  // OmniPost prefixes the state with the platform, e.g. "tiktok.a1b2c3…",
  // so one bridge page can serve every platform.
  var platform = state.split(".")[0];
  var VALID = ["tiktok", "instagram", "facebook", "youtube", "threads"];

  function fail(message) {
    document.getElementById("headline").textContent = "Could not finish";
    document.getElementById("headline").className = "err";
    document.getElementById("detail").textContent = message;
  }

  if (error) {
    fail("The platform reported: " + error);
    return;
  }
  if (!state) {
    // Opened directly rather than arrived at from a sign-in - a normal thing to
    // do while setting the redirect URI up, so say so plainly.
    document.getElementById("headline").textContent = "Nothing to finish here";
    document.getElementById("detail").textContent =
      "This page only does one job: it hands a sign-in back to OmniPost on your " +
      "computer. It works when a platform sends you here at the end of connecting " +
      "an account — opening it directly does nothing, which is expected.";
    return;
  }
  if (VALID.indexOf(platform) === -1) {
    fail("This sign-in did not say which platform it came from. Start the connection again from OmniPost.");
    return;
  }

  var port = params.get("port") || "8000";
  if (!/^\d{2,5}$/.test(port)) port = "8000";

  // Forward the cleaned state so the local side matches what it issued.
  params.set("state", state);
  var tail = "/auth/" + platform + "/callback?" + params.toString();
  var here = "http://127.0.0.1:" + port + tail;

  function send(target) {
    document.getElementById("manual").href = target;
    document.getElementById("fallback").hidden = false;
    window.location.replace(target);
  }

  // Where OmniPost is actually running.
  //
  // Sending the code to 127.0.0.1 only works when the browser is on the same
  // machine as OmniPost. Anyone connecting an account from their own computer
  // would be sent to their own machine instead, where nothing is listening.
  //
  // So the address is read from a file published beside this page. It changes
  // whenever the tunnel is restarted; this page does not, which is what the
  // platforms need - the redirect URI registered with them stays the same for
  // ever. If the file is missing or stale, the local address is still tried,
  // because that is the right answer when you are on the machine itself.
  var request = new XMLHttpRequest();
  request.open("GET", "where.json?t=" + Date.now(), true);
  request.timeout = 4000;
  request.onload = function () {
    var base = "";
    try {
      base = (JSON.parse(request.responseText) || {}).app_url || "";
    } catch (e) { /* fall through to the local address */ }
    send(base ? base.replace(/\/+$/, "") + tail : here);
  };
  request.onerror = request.ontimeout = function () { send(here); };
  request.send();
})();
</script>
</body>
</html>
